services:
  - type: web
    name: fraudguard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "https://odile-portfolio.vercel.app"
      - key: JWT_SECRET_KEY
        generateValue: true
