version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - FG_AES_KEY=${FG_AES_KEY:-}
      - FG_ML_ARTIFACTS=${FG_ML_ARTIFACTS:-}
    ports:
      - "8011:8011"
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8011"]
